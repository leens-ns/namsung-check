name: Patch mobile attendance UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mobile-attendance-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - name: Apply mobile UI fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new)
                  p.write_text(text, encoding="utf-8")

          for path in ["index.html", "demo.html", "sw.js"]:
              replace(path, "20260704-5", "20260710-1")

          css = Path("styles.css")
          text = css.read_text(encoding="utf-8")
          if ".review-identity {" not in text:
              text = text.replace(
                  ".review-item {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  gap: 12px;\n  padding: 10px 12px;\n  border: 1px solid var(--line);\n  border-radius: 8px;\n}\n",
                  ".review-item {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  gap: 12px;\n  padding: 10px 12px;\n  border: 1px solid var(--line);\n  border-radius: 8px;\n}\n\n.review-identity {\n  display: grid;\n  gap: 6px;\n  min-width: 0;\n}\n\n.review-identity .student-meta {\n  display: block;\n  margin-top: 0;\n}\n"
              )
          text = text.replace(
              "  .bulk-actions {\n    align-items: stretch;\n    flex-direction: column;\n  }",
              "  .bulk-actions {\n    grid-template-columns: 1fr;\n    align-items: stretch;\n    flex-direction: column;\n  }"
          )
          css.write_text(text, encoding="utf-8")

          replace(
              "app.js",
              '<div><strong>${escapeHtml(student.name)}</strong><span class="student-meta">${escapeHtml(departmentLabel(student))} · ${escapeHtml(student.grade)}-${escapeHtml(student.classNo)}-${escapeHtml(student.number)}</span></div>',
              '<div class="review-identity"><strong>${escapeHtml(student.name)}</strong><span class="student-meta">${escapeHtml(departmentLabel(student))} · ${escapeHtml(student.grade)}-${escapeHtml(student.classNo)}-${escapeHtml(student.number)}</span></div>'
          )
          replace(
              "demo-app.js",
              '<div><strong>${escapeHtml(student.name)}</strong><span class="student-meta">${escapeHtml(student.department)} · ${escapeHtml(student.grade)}-${escapeHtml(student.classNo)}-${escapeHtml(student.number)}</span></div>',
              '<div class="review-identity"><strong>${escapeHtml(student.name)}</strong><span class="student-meta">${escapeHtml(student.department)} · ${escapeHtml(student.grade)}-${escapeHtml(student.classNo)}-${escapeHtml(student.number)}</span></div>'
          )
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html demo.html sw.js styles.css app.js demo-app.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix mobile attendance controls and review spacing"
            git push
          fi
