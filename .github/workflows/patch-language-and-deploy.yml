name: Patch login timeout and deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-language-and-deploy.yml
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = '20260704-2'
          for name in ['index.html', 'manual.html', 'demo.html', 'sw.js']:
              path = Path(name)
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  for old in ['20260704-1', '20260703-2', '20260703-1']:
                      text = text.replace(old, version)
                  text = text.replace('namsung-attendance-20260704-1', 'namsung-attendance-' + version)
                  text = text.replace('namsung-attendance-20260703-2', 'namsung-attendance-' + version)
                  path.write_text(text, encoding='utf-8')
          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace('getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged,\n  signInWithRedirect, signOut', 'getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged,\n  signInWithPopup, signInWithRedirect, signOut')
          new_func = '''async function startGoogleInteractiveLogin() {
            try {
              sessionStorage.removeItem(AUTH_REDIRECT_KEY);
              const popupLogin = signInWithPopup(auth, googleProvider());
              const result = await Promise.race([
                popupLogin.then(() => "done"),
                new Promise((resolve) => setTimeout(() => resolve(document.hasFocus() ? "fallback" : "wait"), 6000))
              ]);
              if (result === "fallback" && !auth.currentUser) {
                await startGoogleRedirect();
                return;
              }
              if (result === "wait") await popupLogin;
            } catch (error) {
              const fallbackCodes = new Set([
                "auth/popup-blocked",
                "auth/popup-closed-by-user",
                "auth/cancelled-popup-request",
                "auth/operation-not-supported-in-this-environment"
              ]);
              if (fallbackCodes.has(error.code)) {
                await startGoogleRedirect();
                return;
              }
              showLoginError(readableError(error));
              els.googleSignInButton.disabled = false;
              els.googleSignInButton.textContent = "Google 계정으로 로그인";
            }
          }

          async function completeRedirectLogin'''
          text = re.sub(r'async function startGoogleInteractiveLogin\(\) \{.*?\n          async function completeRedirectLogin', new_func, text, flags=re.S)
          text = text.replace('"auth/network-request-failed": "네트워크 연결을 확인한 뒤 다시 로그인해 주세요."', '"auth/network-request-failed": "로그인 연결이 중단되었습니다. 새로고침 후 다시 로그인해 주세요."')
          app.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js manual.html sw.js demo.html
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Stabilize Google login fallback"
            git push
          fi
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: namsung-check
          workload_identity_provider: projects/36959618515/locations/global/workloadIdentityPools/github/providers/namsung-check-v2
          service_account: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install Firebase CLI
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-save --no-package-lock firebase-tools@15.17.0
      - name: Deploy Firebase Hosting
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: node automation/deploy-hosting.cjs
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: node automation/deploy-firestore.cjs
