name: Patch popup login and deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-language-and-deploy.yml
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch popup login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          version = '20260704-5'
          for name in ['index.html', 'manual.html', 'demo.html', 'sw.js']:
              path = Path(name)
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  for old in ['20260704-4', '20260704-3', '20260704-2', '20260704-1', '20260703-2']:
                      text = text.replace(old, version)
                  for old in ['namsung-attendance-20260704-4', 'namsung-attendance-20260704-3', 'namsung-attendance-20260704-2']:
                      text = text.replace(old, 'namsung-attendance-' + version)
                  path.write_text(text, encoding='utf-8')
          sw = Path('sw.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              needle = '  if (event.request.method !== "GET" || requestUrl.origin !== self.location.origin) return;\n'
              if 'startsWith("/__/auth/")' not in text:
                  text = text.replace(needle, needle + '  if (requestUrl.pathname.startsWith("/__/auth/")) return;\n')
              sw.write_text(text, encoding='utf-8')
          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace('getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged,\n  signInWithRedirect, signOut', 'getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged,\n  signInWithPopup, signInWithRedirect, signOut')
          text = text.replace('    await signInWithPopup(auth, googleProvider());', '    const popupLogin = signInWithPopup(auth, googleProvider());\n    const result = await Promise.race([\n      popupLogin.then(() => "done"),\n      new Promise((resolve) => setTimeout(() => resolve(document.hasFocus() ? "fallback" : "wait"), 6000))\n    ]);\n    if (result === "fallback" && !auth.currentUser) {\n      throw Object.assign(new Error("Google 로그인 팝업이 열리지 않았습니다."), { code: "auth/popup-blocked" });\n    }\n    if (result === "wait") await popupLogin;')
          text = text.replace('    if (result === "fallback" && !auth.currentUser) {\n      await startGoogleRedirect();\n      return;\n    }', '    if (result === "fallback" && !auth.currentUser) {\n      throw Object.assign(new Error("Google 로그인 팝업이 열리지 않았습니다."), { code: "auth/popup-blocked" });\n    }')
          text = text.replace(base64.b64decode("""""").decode('utf-8'), '')
          marker = '    "auth/unauthorized-domain": "현재 접속 주소가 Firebase 로그인 허용 목록에 없습니다. 관리자에게 알려 주세요.",\n'
          if '"auth/popup-blocked"' not in text:
              text = text.replace(marker, marker + '    "auth/popup-blocked": "Google 로그인 팝업이 열리지 않았습니다. 브라우저에서 팝업을 허용한 뒤 다시 로그인해 주세요.",\n    "auth/popup-closed-by-user": "Google 로그인 창이 닫혔습니다. 다시 로그인해 주세요.",\n    "auth/cancelled-popup-request": "Google 로그인 요청이 중단되었습니다. 다시 로그인해 주세요.",\n    "auth/operation-not-supported-in-this-environment": "이 브라우저에서는 팝업 로그인이 제한됩니다. Chrome 또는 Safari 최신 버전에서 다시 시도해 주세요.",\n')
          app.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js manual.html sw.js demo.html
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Use popup login without broken redirect fallback"
            git push
          fi
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: namsung-check
          workload_identity_provider: projects/36959618515/locations/global/workloadIdentityPools/github/providers/namsung-check-v2
          service_account: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install Firebase CLI
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-save --no-package-lock firebase-tools@15.17.0
      - name: Deploy Firebase Hosting
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: node automation/deploy-hosting.cjs
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: node automation/deploy-firestore.cjs
