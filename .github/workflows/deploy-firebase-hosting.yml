name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: namsung-check
          workload_identity_provider: projects/36959618515/locations/global/workloadIdentityPools/github/providers/namsung-check-v2
          service_account: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install Firebase CLI
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-save --no-package-lock firebase-tools@15.17.0
      - name: Deploy Firebase Hosting
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: |
          for attempt in 1 2 3; do
            echo "Firebase Hosting deploy attempt ${attempt}/3"
            if node automation/deploy-hosting.cjs; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Deploy Firestore rules only (preserve existing indexes)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          NODE_PATH: ${{ runner.temp }}/firebase-cli/node_modules
        run: |
          node - <<'NODE'
          "use strict";
          
          const accessToken = process.env.GOOGLE_ACCESS_TOKEN;
          if (!accessToken) {
            throw new Error("Google access token was not provided.");
          }
          
          const api = require("firebase-tools/lib/apiv2");
          const auth = require("firebase-tools/lib/requireAuth");
          const ensureApiEnabled = require("firebase-tools/lib/ensureApiEnabled");
          
          api.setAccessToken(accessToken);
          auth.requireAuth = async () => process.env.GOOGLE_SERVICE_ACCOUNT || null;
          
          // The GitHub service account can deploy Firestore rules/indexes but does not
          // have Service Usage Viewer. Firestore is already enabled, so skip only the
          // preflight API enablement check that needs serviceusage.services.get.
          ensureApiEnabled.ensure = async () => undefined;
          
          process.argv = [
            process.execPath,
            "firebase",
            "deploy",
            "--only",
            "firestore:rules",
            "--project",
            "namsung-check",
            "--non-interactive",
          ];
          
          const firebasePackage = require("firebase-tools/package.json");
          require("firebase-tools/lib/bin/cli").cli(firebasePackage);
          NODE
