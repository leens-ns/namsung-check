name: Read NC Hosting version metadata (diagnostic branch only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  read-metadata:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/nc-hosting-5d49e4'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Validate fixed diagnostic target before auth
        run: node automation/read-hosting-version-metadata.mjs --preflight
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: namsung-check
          workload_identity_provider: projects/36959618515/locations/global/workloadIdentityPools/github/providers/namsung-check-v2
          service_account: github-attendance-reminder@namsung-check.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Read fixed version file metadata
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node automation/read-hosting-version-metadata.mjs
